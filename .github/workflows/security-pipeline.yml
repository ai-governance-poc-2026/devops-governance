name: Global Security and Performance Governance
on:
  workflow_call:
jobs:
  universal-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cross-Platform Semgrep SAST Analysis
        run: docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep --config=p/security-audit --error
      - name: Scan Code Matrix for Plaintext Tokens
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if grep -E -i "(password|aws_secret|api_key|token)\s*[:=]\s*['\" \t]*[a-zA-Z0-9_\-\.\~]{10,}" "$file"; then
              echo "❌ CRITICAL SECURITY ERROR: Unencrypted credential leak matched in: $file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -type f -not -path '*/.*' -not -path '*node_modules*' -not -path '*target*')
          if [ $ERRORS -gt 0 ]; then exit 1; fi
      - name: Verify Footprint Weight Budgets
        run: |
          MAX_SIZE_KB=50000
          TOTAL_SIZE=$(du -sb . --exclude=node_modules --exclude=.git --exclude=target | cut -f1)
          TOTAL_SIZE_KB=$((TOTAL_SIZE / 1024))
          if [ $TOTAL_SIZE_KB -gt $MAX_SIZE_KB ]; then
             echo "❌ PERFORMANCE OVERFLOW: File bundle is unoptimized (${TOTAL_SIZE_KB}KB / ${MAX_SIZE_KB}KB Limit)."
             exit 1
          fi
